<!-- nav -->
<nav class="navbar">
    <div class="navbar-container">
        <div class="left-section">
            <!-- Logo as GIF -->
            <img src="assets/logo-v4.gif" alt="Logo" class="logo">
            <!-- Company name as image -->
            <img src="assets/office4.jpg" alt="Nom de l'entreprise" class="company-name">
        </div>
        <div class="right-section">
            <!-- Conditionally render Home link -->
            <a *ngIf="!hideLinks" class="nav-item" href="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Accueil</a>
            <!-- Conditionally render Prediction link -->
            <a *ngIf="!hideLinks" class="nav-item" href="/prediction" routerLinkActive="active">Prédiction</a>
            <!-- Conditionally render Users link -->
            <!-- Conditionally render Users link only if the user is an admin -->
            <a *ngIf="!hideLinks && isAdmin" class="nav-item" href="/users" routerLinkActive="active">Utilisateurs</a>
        </div>             
    </div>
</nav>


<!-- Logout Button -->


<!-- main app container -->
<div class="app-container" [ngClass]="{ 'bg-light': user }">
    <div class="logout-button">
    <button *ngIf="!hideLinks" class="button_log" (click)="logout()">Déconnexion</button>
</div>
    <alert></alert>
    <router-outlet></router-outlet>
</div>
