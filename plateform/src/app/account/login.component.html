<div class="card" style="max-width: 600px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
    <h4 class="card-header" style="background-color: #3399CC; color: white; text-align: center; padding: 15px; border-top-left-radius: 10px; border-top-right-radius: 10px;">Connexion</h4>
    <div class="card-body" style="padding: 20px;">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" formControlName="username" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.username.errors }" />
                <div *ngIf="submitted && f.username.errors" class="invalid-feedback">
                    <div *ngIf="f.username.errors.required">Nom d'utilisateur requis</div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" formControlName="password" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
                <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                    <div *ngIf="f.password.errors.required">Mot de passe requis</div>
                </div>
            </div>
            <div>
                <button [disabled]="loading" class="btn btn-primary" style="width: 100%; background-color: #3399CC; border: none; border-radius: 5px; padding: 10px; cursor: pointer;">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                    Connexion
                </button>
                <a routerLink="../register"  style="width: 100%; display: block; text-align: center; margin-top: 10px; color: #3399CC; text-decoration: none;">S'inscrire</a>
            <div class="mb-3 col text-end">
                <a routerLink="../forgot-password"  style="color: #3399CC; text-decoration: none;">Mot de passe oublié ?</a>
            </div>
            </div>
        </form>
    </div>
</div>
