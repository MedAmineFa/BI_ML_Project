<div class="card" style="max-width: 600px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
    <h4 class="card-header" style="background-color: #3399CC; color: white; text-align: center; padding: 15px; border-top-left-radius: 10px; border-top-right-radius: 10px;">Inscription</h4>
    <div class="card-body" style="padding: 20px;">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">Prénom</label>
                <input type="text" formControlName="firstName" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.firstName.errors }" style="width: 100%; border: 1px solid #CCCCCC; border-radius: 5px; padding: 10px; box-sizing: border-box;" />
                <div *ngIf="submitted && f.firstName.errors" class="invalid-feedback" style="color: #DC3545; margin-top: 5px;">
                    <div *ngIf="f.firstName.errors.required">Le prénom est requis</div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Nom de famille</label>
                <input type="text" formControlName="lastName" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.lastName.errors }" style="width: 100%; border: 1px solid #CCCCCC; border-radius: 5px; padding: 10px; box-sizing: border-box;" />
                <div *ngIf="submitted && f.lastName.errors" class="invalid-feedback" style="color: #DC3545; margin-top: 5px;">
                    <div *ngIf="f.lastName.errors.required">Le nom de famille est requis</div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" formControlName="email" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.email.errors }" style="width: 100%; border: 1px solid #CCCCCC; border-radius: 5px; padding: 10px; box-sizing: border-box;" />
                <div *ngIf="submitted && f.email.errors" class="invalid-feedback" style="color: #DC3545; margin-top: 5px;">
                    <div *ngIf="f.email.errors.required">Email est requis</div>
                    <div *ngIf="f.email.errors.email">Email doit être une adresse email valide</div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" formControlName="username" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.username.errors }" style="width: 100%; border: 1px solid #CCCCCC; border-radius: 5px; padding: 10px; box-sizing: border-box;" />
                <div *ngIf="submitted && f.username.errors" class="invalid-feedback" style="color: #DC3545; margin-top: 5px;">
                    <div *ngIf="f.username.errors.required">Le nom d'utilisateur est requis</div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" formControlName="password" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" style="width: 100%; border: 1px solid #CCCCCC; border-radius: 5px; padding: 10px; box-sizing: border-box;" />
                <div *ngIf="submitted && f.password.errors" class="invalid-feedback" style="color: #DC3545; margin-top: 5px;">
                    <div *ngIf="f.password.errors.required">Le mot de passe est requis</div>
                    <div *ngIf="f.password.errors.minlength">Le mot de passe doit comporter au moins 6 caractères</div>
                </div>
            </div>
            <div>
                <button [disabled]="loading" class="btn btn-primary" style="width: 100%; background-color: #3399CC; border: none; border-radius: 5px; padding: 10px; cursor: pointer;">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                    Inscription
                </button>
                <a routerLink="../login" class="btn btn-link" style="width: 100%; display: block; text-align: center; margin-top: 10px; color: #3399CC; text-decoration: none;">Annuler</a>
            </div>
        </form>
    </div>
</div>
